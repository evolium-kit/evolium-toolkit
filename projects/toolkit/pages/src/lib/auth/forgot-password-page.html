<evo-auth-shell>
  <span slot="brand">{{ texto('brand') }}</span>
  <h1 slot="title">{{ texto('title') }}</h1>
  <p slot="subtitle">{{ texto('subtitle') }}</p>

  @if (enviado()) {
    <p class="evo-page__sucesso" role="status">{{ texto('sent') }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submeter()" novalidate>
      @if (erro(); as mensagem) {
        <p class="evo-page__erro" role="alert">{{ mensagem }}</p>
      }

      <evo-field>
        <label for="evo-forgot-email">{{ texto('email') }}</label>
        <input
          evoInput
          id="evo-forgot-email"
          type="email"
          autocomplete="email"
          formControlName="email"
          [invalid]="invalido"
          aria-describedby="evo-forgot-email-erro"
        />
        @if (invalido) {
          <span slot="error" id="evo-forgot-email-erro">Indica um email válido.</span>
        }
      </evo-field>

      <button evoButton type="submit" block [loading]="aEnviar()">{{ texto('submit') }}</button>
    </form>
  }

  <p slot="footer">
    <a class="evo-page__ligacao" [routerLink]="loginLink()">{{ texto('back') }}</a>
  </p>
</evo-auth-shell>
