<main class="pg">
  <header class="pg__head">
    <div>
      <h1>Evolium Toolkit — playground</h1>
      <p class="muted">
        Tokens de tema e componentes temáveis. Esquema activo: <strong>{{ scheme() }}</strong>
      </p>
    </div>
    <div class="row">
      <a evoButton variant="outline" routerLink="/_evo/theme">Abrir Theme Studio</a>
      <button evoButton variant="ghost" (click)="theme.toggleScheme()">
        Alternar claro/escuro
      </button>
    </div>
  </header>

  <app-theme-demo />
  <app-button-demo />
  <app-badge-demo />
  <app-field-demo />
  <app-text-field-demo />
  <app-select-demo />
  <app-modal-demo />
  <app-drawer-demo />
  <app-data-table-demo />
  <app-services-demo />
</main>
